name: Release

# Push a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`) to
# build a prebuilt release of dustm for Windows and macOS. The install
# scripts (scripts/Install-DustCLI.ps1, scripts/install-dustcli.sh on
# macOS) download the latest release asset instead of building from
# source on the target machine - this is what actually builds it, on a
# runner matching the target OS/arch, so a broken native module (keytar)
# fails loudly here instead of silently on a user's machine.
#
# Merging a PR to main does NOT publish a release by itself - only a
# pushed version tag does, or a manual run below (Actions tab -> Release
# -> Run workflow), which builds whichever branch you pick and tags/
# publishes it under the tag you type in.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: dustm-windows-x64
          - os: macos-14 # Apple Silicon (arm64)
            asset: dustm-macos-arm64
          - os: macos-15-intel # Intel (x64) - macos-13 was fully retired Dec 2025
            asset: dustm-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:prod

      # tsup leaves runtime dependencies (keytar, ink, @dust-tt/client, ...)
      # external rather than bundling them into dist/index.js, so
      # node_modules has to ship alongside dist/ - prune devDependencies
      # (tsup, ts-node, @types/*, ...) out first since they're only needed
      # to produce the build, not to run it.
      - name: Prune to production dependencies
        run: npm prune --omit=dev

      # Catches exactly the class of bug that shipped once already: a
      # package needed at runtime (e.g. imported directly in src/) getting
      # pruned above because it was also (redundantly, and incorrectly)
      # listed in devDependencies, which made npm's lockfile mark it
      # dev-only. `--version` exits immediately with no auth/network calls
      # (see App.tsx), so this only exercises module resolution - if
      # anything actually needed at runtime got pruned, this fails the
      # build here instead of shipping a release that crashes for everyone
      # on the very first run.
      - name: Smoke test the built CLI
        run: node dist/index.js --version

      - name: Package release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist,node_modules,package.json -DestinationPath "${{ matrix.asset }}.zip"

      - name: Package release (macOS)
        if: runner.os == 'macOS'
        run: |
          zip -qr "${{ matrix.asset }}.zip" dist node_modules package.json

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -name '*.zip' -exec cp {} release/ \;
          ls -la release

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # --target pins the tag to the exact commit this workflow run
            # actually built - important for workflow_dispatch, where the
            # tag doesn't exist yet and would otherwise default to whatever
            # the default branch points to by the time this step runs.
            gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --target "${{ github.sha }}" --generate-notes
          fi
          gh release upload "$TAG" release/*.zip --repo "${{ github.repository }}" --clobber
