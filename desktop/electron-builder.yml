# Packaging for dustm Desktop (preview): Windows (NSIS installer + zip), macOS
# (zip, unsigned) and Linux (AppImage). Built by the "desktop" job in
# .github/workflows/release.yml. Artifact names carry NO version so the install
# scripts can use releases/latest/download/<name>. The mac arch comes from the
# host (macos-14 = arm64, macos-15-intel = x64); the workflow passes --arm64/--x64.
# Linux needs libsecret (libsecret-1-0) at runtime for keytar.
appId: com.mantu.dustm.desktop
productName: dustm Desktop
copyright: Mantu
directories:
  output: release
files:
  - out/**
  - package.json
asar: true
# keytar is the only native module. It is N-API (ABI-stable), so the prebuilt
# keytar.node that npm installs runs under Electron as is: no rebuild step.
# It has to live outside the asar to be loadable.
npmRebuild: false
asarUnpack:
  - "**/node_modules/keytar/**"
win:
  icon: build/icon.ico
  artifactName: dustm-desktop-windows-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  artifactName: dustm-desktop-macos-${arch}.${ext}
  target:
    - target: zip
linux:
  icon: build/icon.png
  category: Development
  artifactName: dustm-desktop-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: dustm-desktop-windows-${arch}-setup.${ext}
